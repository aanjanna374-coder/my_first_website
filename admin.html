<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | SafeGuard</title><link rel="stylesheet" href="style.css"></head><body><nav class="site-nav"><a class="brand" href="index.html"><span class="brand-mark">&#10022;</span>SafeGuard</a><div class="nav-links"><a href="index.html">Back to app</a></div></nav><header class="page-title"><div class="page-shell"><p class="eyebrow">Operations center</p><h1>Admin dashboard</h1><p>Review incoming community messages and support requests.</p></div></header><main class="content page-shell"><div class="card-grid" style="margin-bottom:28px"><article class="card icon-card"><div class="icon">&#9993;</div><h3 id="messageCount">0</h3><p>Messages received</p></article><article class="card icon-card"><div class="icon">&#9888;</div><h3>24/7</h3><p>Response coverage</p></article><article class="card icon-card"><div class="icon">&#10003;</div><h3>Active</h3><p>System status</p></article></div><section class="table-card"><table><thead><tr><th>Name</th><th>Email</th><th>Message</th><th>Status</th></tr></thead><tbody id="data"><tr><td colspan="4">Loading messages...</td></tr></tbody></table></section></main><footer class="site-footer">SafeGuard operations center &middot; Keep communities safe.</footer><script>fetch('http://localhost:5000/contacts').then(r=>r.json()).then(data=>{document.getElementById('messageCount').textContent=data.length;document.getElementById('data').innerHTML=data.length?data.map(d=>`<tr><td>${d.name||'Anonymous'}</td><td>${d.email||'—'}</td><td>${d.message||'—'}</td><td><span class="status">New</span></td></tr>`).join(''):'<tr><td colspan="4">No messages yet.</td></tr>'}).catch(()=>{document.getElementById('data').innerHTML='<tr><td colspan="4">Backend is offline. Start the server to load messages.</td></tr>'});</script></body></html>
