<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an Incident | SafeGuard</title><link rel="stylesheet" href="style.css"></head><body><nav class="site-nav"><a class="brand" href="index.html"><span class="brand-mark">&#10022;</span>SafeGuard</a><div class="nav-links"><a href="index.html">Home</a><a class="active" href="report.html">Report</a><a href="safety.html">Safety</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a></div></nav><header class="page-title"><div class="page-shell"><p class="eyebrow">Community response</p><h1>Report an incident</h1><p>Share verified details so the right people can respond quickly.</p></div></header><main class="content page-shell"><section class="form-card"><div class="notice">For immediate danger, call <strong>112</strong> first. Use this form for community reporting.</div><form onsubmit="reportSubmitted(event)" style="margin-top:24px"><div class="form-grid"><div class="field"><label for="reporter">Your name</label><input id="reporter" type="text" placeholder="Full name" required></div><div class="field"><label for="location">Location</label><input id="location" type="text" placeholder="City or nearby landmark" required></div><div class="field"><label for="type">Incident type</label><select id="type" required><option value="">Choose a type</option><option>Flood</option><option>Earthquake</option><option>Fire</option><option>Cyclone</option><option>Other</option></select></div><div class="field"><label for="time">When did it happen?</label><input id="time" type="datetime-local" required></div><div class="field full"><label for="details">What happened?</label><textarea id="details" placeholder="Describe the situation, people affected, and any immediate risks..." required></textarea></div></div><button class="btn" type="submit">Submit report &#8594;</button><p id="successMessage" class="notice" style="display:none;margin-top:18px"></p></form></section></main><footer class="site-footer">&copy; 2025 SafeGuard &middot; <a href="contact.html">Need help?</a></footer><script src="script.js"></script></body></html>
